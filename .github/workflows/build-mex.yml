name: Build MEX Binaries

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name to build, or "auto" to scan for all missing platforms'
        required: true
        default: 'auto'
        type: string
      platforms:
        description: 'Platforms to build for'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - maca64
          - maci64
          - glnxa64
          - win64

permissions:
  contents: write
  issues: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - uses: actions/checkout@v4

      - id: set
        shell: python
        run: |
          import json, os, glob, re

          pkg_input = "${{ inputs.package }}"
          plat_input = "${{ inputs.platforms }}"

          PLATFORM_SPECIFIC = {"maci64", "win64", "glnxa64"}
          RUNNER_MAP = {
              "maca64":  "macos-latest",
              "maci64":  "macos-13",
              "glnxa64": "ubuntu-latest",
              "win64":   "windows-latest",
          }
          GITHUB_URL_RE = re.compile(
              r"https?://github\.com/([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)"
          )

          platforms = list(RUNNER_MAP.keys()) if plat_input == "all" else [plat_input]

          entries = []
          paths = (
              sorted(glob.glob("packages/*/package.json"))
              if pkg_input == "auto"
              else [f"packages/{pkg_input}/package.json"]
          )

          for path in paths:
              try:
                  with open(path) as f:
                      data = json.load(f)
              except (OSError, json.JSONDecodeError):
                  continue
              name = data.get("name", "")

              # Discover source GitHub repo from download URLs or homepage
              # Skip URLs pointing to this registry's own releases (CI-built binaries)
              THIS_REPO = "${{ github.repository }}"
              repo_url = ""
              for vdata in data.get("versions", {}).values():
                  if not isinstance(vdata, dict):
                      continue
                  for pdata in vdata.get("platforms", {}).values():
                      url = pdata.get("url", "")
                      m = GITHUB_URL_RE.search(url)
                      if m and f"{m.group(1)}/{m.group(2)}" != THIS_REPO:
                          repo_url = f"https://github.com/{m.group(1)}/{m.group(2)}"
                          break
                  if repo_url:
                      break
              if not repo_url:
                  m = GITHUB_URL_RE.search(data.get("homepage", ""))
                  if m and f"{m.group(1)}/{m.group(2)}" != THIS_REPO:
                      repo_url = f"https://github.com/{m.group(1)}/{m.group(2)}"
              if not repo_url:
                  print(f"  SKIP {name}: no GitHub source repo found")
                  continue

              for ver, vdata in data.get("versions", {}).items():
                  if not isinstance(vdata, dict):
                      continue
                  if vdata.get("yanked"):
                      continue
                  plats = set(vdata.get("platforms", {}).keys())
                  # Only build for platform-specific packages with gaps
                  if plats & PLATFORM_SPECIFIC and "all" not in plats:
                      for plat in platforms:
                          if plat not in plats:
                              entries.append({
                                  "package": name,
                                  "version": ver,
                                  "platform": plat,
                                  "runner": RUNNER_MAP[plat],
                                  "repo_url": repo_url,
                              })

          include_json = json.dumps(entries)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"include={include_json}\n")

          print(f"Matrix: {len(entries)} job(s)")
          for e in entries:
              print(f"  {e['package']}@{e['version']} on {e['platform']} ({e['runner']})")

  build:
    needs: matrix
    if: ${{ needs.matrix.outputs.include != '[]' }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          cache: true

      - name: Download source
        shell: bash
        run: |
          REPO_URL="${{ matrix.repo_url }}"
          VERSION="${{ matrix.version }}"
          mkdir -p build/src

          # Try common tag formats
          CLONED=false
          for TAG in "v${VERSION}" "${VERSION}" "R${VERSION}"; do
            if git ls-remote --tags "$REPO_URL" "refs/tags/$TAG" 2>/dev/null | grep -q .; then
              git clone --depth 1 --branch "$TAG" "$REPO_URL" build/src/pkg
              CLONED=true
              break
            fi
          done

          if [ "$CLONED" = false ]; then
            echo "::warning::No matching tag found, cloning default branch"
            git clone --depth 1 "$REPO_URL" build/src/pkg
          fi

      - name: Build
        uses: matlab-actions/run-command@v2
        with:
          command: |
            cd('build/src/pkg');

            % 1. Check for build.script in tbxmanager.json
            if isfile('tbxmanager.json')
                pkg = jsondecode(fileread('tbxmanager.json'));
                if isfield(pkg, 'build') && isfield(pkg.build, 'script')
                    fprintf('Running build script: %s\n', pkg.build.script);
                    run(pkg.build.script);
                    return;
                end
            end

            % 2. Look for common build entry points
            entryPoints = {'install.m', 'make.m', 'setup.m', 'compile.m', 'build.m'};
            % Also check for install_<pkgname>.m pattern
            d = dir('install_*.m');
            if ~isempty(d)
                entryPoints = [{d(1).name}, entryPoints];
            end
            for i = 1:numel(entryPoints)
                if isfile(entryPoints{i})
                    fprintf('Found build entry point: %s\n', entryPoints{i});
                    run(entryPoints{i});
                    return;
                end
            end

            % 3. Search subdirectories for entry points
            for sub = ["src", "mex", "interfaces/matlab"]
                if isfolder(sub)
                    d = dir(fullfile(sub, '**', 'make.m'));
                    if ~isempty(d)
                        fprintf('Found build entry point: %s\n', fullfile(d(1).folder, d(1).name));
                        cd(d(1).folder);
                        run('make.m');
                        return;
                    end
                end
            end

            % 4. Fall back to mex on all C/C++ files
            cFiles = [dir('**/*.c'); dir('**/*.cpp')];
            if isempty(cFiles)
                fprintf('No C/C++ source files found — nothing to build.\n');
                return;
            end
            fprintf('Auto-compiling %d C/C++ file(s) with mex\n', numel(cFiles));
            for i = 1:numel(cFiles)
                src = fullfile(cFiles(i).folder, cFiles(i).name);
                fprintf('  mex %s\n', src);
                mex('-O', '-largeArrayDims', src);
            end

      - name: Build with make (fallback for non-MEX)
        shell: bash
        run: |
          cd build/src/pkg
          # If no .mex* files were produced but a Makefile exists, try make
          if ! find . -name "*.mex*" | grep -q . && [ -f Makefile ]; then
            echo "No MEX files produced, trying Makefile"
            make
          fi

      - name: Package artifact
        shell: bash
        run: |
          PKG="${{ matrix.package }}"
          VER="${{ matrix.version }}"
          PLAT="${{ matrix.platform }}"
          VER_UNDER=$(echo "$VER" | tr '.' '_')
          PLAT_UPPER=$(echo "$PLAT" | tr '[:lower:]' '[:upper:]')
          REPO_ROOT=$(pwd)
          mkdir -p "${REPO_ROOT}/build/out"

          cd "${REPO_ROOT}/build/src/pkg"

          # Collect all .m, .mex*, and standalone binaries
          FILELIST=$(mktemp)
          find . \( -name "*.m" -o -name "*.mex*" \) > "$FILELIST"

          if [ ! -s "$FILELIST" ]; then
            # Check for standalone binaries (e.g., espresso)
            find . -maxdepth 2 -type f -executable ! -name "*.sh" > "$FILELIST"
          fi

          if [ ! -s "$FILELIST" ]; then
            echo "::error::No build artifacts found"
            exit 1
          fi

          tar czf "${REPO_ROOT}/build/out/${PKG}_${VER_UNDER}_${PLAT_UPPER}.tgz" -T "$FILELIST"
          echo "$VER" > "${REPO_ROOT}/build/out/version.txt"
          rm "$FILELIST"

      - name: Compute SHA256
        shell: bash
        run: |
          cd build/out
          for f in *.tgz; do
            [ -f "$f" ] && shasum -a 256 "$f" | tee "${f}.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.version }}-${{ matrix.platform }}
          path: build/out/*

  notify-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report build failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ensure label exists
          gh label create "build-failure" --color "d73a4a" \
            --description "Automated MEX build failed" 2>/dev/null || true

          gh issue create \
            --title "MEX build failed for ${{ github.event.inputs.package }}" \
            --body "$(cat <<'EOF'
          The automated MEX build failed. This usually means the package needs
          a custom build script.

          **How to fix:** Add a `build` section to your `tbxmanager.json`:

          ```json
          {
            "build": {
              "script": "build.m"
            }
          }
          ```

          Then create `build.m` in your repository root with the commands
          needed to compile your MEX files (e.g., `mex -O myfile.c`).

          See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
          EOF
          )" \
            --label "build-failure"

  publish:
    needs: build
    if: ${{ always() && contains(needs.build.result, 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="builds/$(date +%Y%m%d)"
          FILES=$(find artifacts -name "*.tgz" -type f)
          if [ -z "$FILES" ]; then
            echo "No artifacts to publish"
            exit 0
          fi
          if ! gh release view "$TAG" &>/dev/null; then
            gh release create "$TAG" \
              --title "MEX Binaries $(date +%Y-%m-%d)" \
              --notes "Auto-built MEX binaries for missing platforms." \
              --prerelease \
              $FILES
          else
            gh release upload "$TAG" $FILES --clobber
          fi

      - name: Update package.json files
        shell: bash
        run: |
          TAG="builds/$(date +%Y%m%d)"
          REPO="${{ github.repository }}"

          for dir in artifacts/*/; do
            [ -f "$dir/version.txt" ] || continue
            VER=$(cat "$dir/version.txt")

            # Artifact dir name: {package}-{version}-{platform}
            DIRNAME=$(basename "$dir")
            PLAT=$(echo "$DIRNAME" | rev | cut -d- -f1 | rev)
            PKG_VER=$(echo "$DIRNAME" | rev | cut -d- -f3- | rev)
            PKG=$(echo "$PKG_VER" | rev | cut -d- -f2- | rev)

            for tgz in "$dir"*.tgz; do
              [ -f "$tgz" ] || continue
              FILENAME=$(basename "$tgz")
              SHA256=$(cut -d' ' -f1 < "${tgz}.sha256")
              URL="https://github.com/${REPO}/releases/download/${TAG}/${FILENAME}"

              echo "Updating $PKG@$VER platform=$PLAT"
              python3 - "$PKG" "$VER" "$PLAT" "$URL" "$SHA256" <<'PYEOF'
          import json, sys
          pkg, ver, plat, url, sha = sys.argv[1:]
          pkg_file = f"packages/{pkg}/package.json"
          with open(pkg_file) as f:
              data = json.load(f)
          if ver in data["versions"]:
              data["versions"][ver].setdefault("platforms", {})[plat] = \
                  {"url": url, "sha256": sha}
              with open(pkg_file, "w") as f:
                  json.dump(data, f, indent=2)
                  f.write("\n")
          else:
              print(f"  WARNING: version {ver} not found in {pkg_file}")
          PYEOF
            done
          done

      - name: Commit and push
        env:
          PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/
          if git diff --cached --quiet; then
            echo "No package.json changes"
          else
            git commit -m "feat(registry): add MEX binaries for missing platforms"
            git pull --rebase
            git push "https://x-access-token:${PAT}@github.com/${{ github.repository }}.git" HEAD:main
          fi
