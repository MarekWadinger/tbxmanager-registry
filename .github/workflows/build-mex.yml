name: Build MEX Binaries

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name to build, or "auto" to scan for all missing maca64'
        required: true
        default: 'auto'
        type: string
      platforms:
        description: 'Platforms to build for'
        required: true
        default: 'maca64'
        type: choice
        options:
          - maca64
          - all

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - uses: actions/checkout@v4

      - id: set
        shell: python
        run: |
          import json, os, glob

          pkg_input = "${{ inputs.package }}"
          plat_input = "${{ inputs.platforms }}"

          PLATFORM_SPECIFIC = {"maci64", "win64", "glnxa64"}
          RUNNER_MAP = {
              "maca64":  "macos-latest",
              "maci64":  "macos-13",
              "glnxa64": "ubuntu-latest",
              "win64":   "windows-latest",
          }

          platforms = list(RUNNER_MAP.keys()) if plat_input == "all" else [plat_input]

          entries = []
          paths = (
              sorted(glob.glob("packages/*/package.json"))
              if pkg_input == "auto"
              else [f"packages/{pkg_input}/package.json"]
          )

          for path in paths:
              try:
                  with open(path) as f:
                      data = json.load(f)
              except (OSError, json.JSONDecodeError):
                  continue
              name = data.get("name", "")
              for ver, vdata in data.get("versions", {}).items():
                  if not isinstance(vdata, dict):
                      continue
                  plats = set(vdata.get("platforms", {}).keys())
                  if plats & PLATFORM_SPECIFIC and "all" not in plats:
                      for plat in platforms:
                          if plat not in plats:
                              entries.append({"package": name, "version": ver,
                                              "platform": plat, "runner": RUNNER_MAP[plat]})

          include_json = json.dumps(entries)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"include={include_json}\n")

          print(f"Matrix: {len(entries)} job(s)")
          for e in entries:
              print(f"  {e['package']}@{e['version']} on {e['platform']} ({e['runner']})")

  build:
    needs: matrix
    if: ${{ needs.matrix.outputs.include != '[]' }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          cache: true

      - name: Install system dependencies
        shell: bash
        run: |
          case "${{ matrix.package }}" in
            clpmex)
              case "${{ matrix.platform }}" in
                maca64|maci64)
                  brew install clp
                  CLP_PREFIX=$(brew --prefix clp)
                  CUI_PREFIX=$(brew --prefix coinutils)
                  echo "CLP_INCLUDE=${CLP_PREFIX}/include/clp/coin:${CUI_PREFIX}/include/coinutils/coin" >> "$GITHUB_ENV"
                  echo "CLP_LIB=${CLP_PREFIX}/lib:${CUI_PREFIX}/lib" >> "$GITHUB_ENV"
                  ;;
                glnxa64)
                  sudo apt-get update && sudo apt-get install -y coinor-libclp-dev coinor-libcoinutils-dev
                  echo "CLP_INCLUDE=/usr/include/coin" >> "$GITHUB_ENV"
                  echo "CLP_LIB=/usr/lib" >> "$GITHUB_ENV"
                  ;;
                win64) echo "CLP on Windows requires manual setup" ;;
              esac
              ;;
            oasesmex|espresso|sedumi) ;;  # no system deps
          esac

      - name: Download source
        shell: bash
        run: |
          mkdir -p build/src
          case "${{ matrix.package }}" in
            sedumi)
              curl -sL "https://github.com/sqlp/sedumi/archive/refs/heads/master.zip" \
                -o build/src/source.zip
              unzip -q build/src/source.zip -d build/src
              mv build/src/sedumi-master build/src/pkg
              ;;
            espresso)
              curl -sL "https://github.com/psksvp/espresso-ab-1.0/archive/refs/heads/master.zip" \
                -o build/src/source.zip
              unzip -q build/src/source.zip -d build/src
              mv build/src/espresso-ab-1.0-master build/src/pkg
              ;;
            clpmex)
              curl -sL "http://people.ee.ethz.ch/~mpt/tbx/pool/clpmex/1_0/clpmex_1_0_maci64.zip" \
                -o build/src/source.zip
              unzip -q build/src/source.zip -d build/src
              mv build/src/clpmex_1_0_maci64 build/src/pkg
              ;;
            oasesmex)
              curl -sL "https://github.com/coin-or/qpOASES/archive/refs/tags/releases/3.2.0.zip" \
                -o build/src/source.zip
              unzip -q build/src/source.zip -d build/src
              mv build/src/qpOASES-releases-3.2.0 build/src/pkg
              ;;
          esac

      - name: Build MEX
        if: matrix.package != 'espresso'
        uses: matlab-actions/run-command@v2
        with:
          command: |
            cd('build/src/pkg');
            switch '${{ matrix.package }}'
              case 'sedumi'
                install_sedumi('-rebuild', '-nopath');
              case 'clpmex'
                incPaths = strsplit(getenv('CLP_INCLUDE'), ':');
                libPaths = strsplit(getenv('CLP_LIB'), ':');
                incArgs = strcat('-I', incPaths);
                libArgs = strcat('-L', libPaths);
                mex('-O', '-largeArrayDims', incArgs{:}, libArgs{:}, 'mexclp.cpp', '-lClp', '-lCoinUtils')
              case 'oasesmex'
                cd('interfaces/matlab');
                make;
            end

      - name: Build espresso (C binary)
        if: matrix.package == 'espresso'
        shell: bash
        run: |
          cd build/src/pkg
          if [ -f Makefile ]; then
            make
          else
            cc -O2 -o espresso *.c -lm 2>/dev/null || \
            cc -O2 -o espresso main.c *.c -lm 2>/dev/null || \
            { echo "Espresso compilation failed" && exit 1; }
          fi

      - name: Package artifact
        shell: bash
        run: |
          PKG="${{ matrix.package }}"
          VER="${{ matrix.version }}"
          PLAT="${{ matrix.platform }}"
          VER_UNDER=$(echo "$VER" | tr '.' '_')
          PLAT_UPPER=$(echo "$PLAT" | tr '[:lower:]' '[:upper:]')
          mkdir -p build/out

          case "$PKG" in
            sedumi)
              cd build/src/pkg
              find . -name "*.m" -o -name "*.mex*" | \
                tar czf "../../out/${PKG}_${VER_UNDER}_${PLAT_UPPER}.tgz" -T -
              ;;
            espresso)
              ESPRESSO_BIN=$(find build/src/pkg -type f -name "espresso" | head -1)
              [ -n "$ESPRESSO_BIN" ] || { echo "ERROR: espresso binary not found" && exit 1; }
              tar czf "build/out/${PKG}_${VER_UNDER}_${PLAT_UPPER}.tgz" \
                -C "$(dirname "$ESPRESSO_BIN")" espresso
              ;;
            clpmex)
              cd build/src/pkg
              find . -name "*.m" -o -name "*.mex*" | \
                tar czf "../../out/${PKG}_${VER_UNDER}_${PLAT_UPPER}.tgz" -T -
              ;;
            oasesmex)
              cd build/src/pkg/interfaces/matlab
              find . -name "*.m" -o -name "*.mex*" | \
                tar czf "../../../../out/${PKG}_${VER_UNDER}_${PLAT_UPPER}.tgz" -T -
              ;;
          esac

          # Record version for the publish step
          echo "$VER" > build/out/version.txt

      - name: Compute SHA256
        shell: bash
        run: |
          cd build/out
          for f in *.tgz; do
            [ -f "$f" ] && shasum -a 256 "$f" | tee "${f}.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.version }}-${{ matrix.platform }}
          path: build/out/*

  publish:
    needs: build
    if: ${{ always() && contains(needs.build.result, 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="builds/$(date +%Y%m%d)"
          FILES=$(find artifacts -name "*.tgz" -type f)
          if [ -z "$FILES" ]; then
            echo "No artifacts to publish"
            exit 0
          fi
          if ! gh release view "$TAG" &>/dev/null; then
            gh release create "$TAG" \
              --title "MEX Binaries $(date +%Y-%m-%d)" \
              --notes "Auto-built MEX binaries for missing platforms." \
              --prerelease \
              $FILES
          else
            gh release upload "$TAG" $FILES --clobber
          fi

      - name: Update package.json files
        shell: bash
        run: |
          TAG="builds/$(date +%Y%m%d)"
          REPO="${{ github.repository }}"

          for dir in artifacts/*/; do
            [ -f "$dir/version.txt" ] || continue
            VER=$(cat "$dir/version.txt")

            # Artifact dir name: {package}-{version}-{platform}
            DIRNAME=$(basename "$dir")
            PLAT=$(echo "$DIRNAME" | rev | cut -d- -f1 | rev)
            PKG_VER=$(echo "$DIRNAME" | rev | cut -d- -f3- | rev)
            PKG=$(echo "$PKG_VER" | rev | cut -d- -f2- | rev)

            for tgz in "$dir"*.tgz; do
              [ -f "$tgz" ] || continue
              FILENAME=$(basename "$tgz")
              SHA256=$(cut -d' ' -f1 < "${tgz}.sha256")
              URL="https://github.com/${REPO}/releases/download/${TAG}/${FILENAME}"

              echo "Updating $PKG@$VER platform=$PLAT"
              python3 - "$PKG" "$VER" "$PLAT" "$URL" "$SHA256" <<'PYEOF'
          import json, sys
          pkg, ver, plat, url, sha = sys.argv[1:]
          pkg_file = f"packages/{pkg}/package.json"
          with open(pkg_file) as f:
              data = json.load(f)
          if ver in data["versions"]:
              data["versions"][ver].setdefault("platforms", {})[plat] = \
                  {"url": url, "sha256": sha}
              with open(pkg_file, "w") as f:
                  json.dump(data, f, indent=2)
                  f.write("\n")
          else:
              print(f"  WARNING: version {ver} not found in {pkg_file}")
          PYEOF
            done
          done

      - name: Commit and push
        env:
          PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/
          if git diff --cached --quiet; then
            echo "No package.json changes"
          else
            git commit -m "feat(registry): add MEX binaries for missing platforms"
            git pull --rebase
            git push "https://x-access-token:${PAT}@github.com/${{ github.repository }}.git" HEAD:main
          fi
